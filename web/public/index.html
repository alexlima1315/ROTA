function save(){localStorage.setItem('rotaState',JSON.stringify(state))}function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}function pct(){return Math.round(state.done.length/topics.length*100)}function selectArea(a){selectedArea=a;filter='all';setPage('trilha')}function renderSubjectNav(){document.getElementById('subjectNav').innerHTML=areasMeta.map(([a,i])=>`<button class="subject" onclick="selectArea('${a}')"><span>${i}</span>${a}</button>`).join('')}function setPage(p){if(p==='trilha')filter='all';page=p;document.getElementById('sidebar').classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('search').addEventListener('input',e=>{if(page==='materiais'){renderMaterials(document.getElementById('app'),e.target.value);return}if(page!=='trilha')setPage('trilha');render(e.target.value)});
function card(t){let done=state.done.includes(t.id);return `<article class="course" onclick="openLesson('${t.id}')"><div class="course-top"><div class="course-icon">${t.icon}</div><span class="tag">${t.tag}</span></div><h3>${t.title}</h3><p>${t.desc}</p><div class="progress-line"><i style="width:${done?100:0}%"></i></div><div class="progress-meta"><span>${done?'Concluído':'Comece por aqui'}</span><span>${done?'100%':'0%'}</span></div><div class="course-foot"><span>◷ ${t.time} de leitura</span><span class="arrow">${done?'Revisar':'Estudar'} →</span></div></article>`}
function render(search=''){let app=document.getElementById('app');let completed=state.done.length;let title={home:'Visão geral',trilha:'Minha trilha',revisao:'Revisão espaçada',questoes:'Questões rápidas',erros:'Caderno de erros',materiais:'Biblioteca de materiais'}[page];document.getElementById('crumb').textContent=title;document.getElementById('sideProgress').style.width=pct()+'%';if(page==='home'){app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Sua preparação começa por aqui</div><h1>Estude no seu ritmo.<br>Avance com confiança.</h1><p>Conteúdo direto, passos pequenos e prática para transformar dificuldade em progresso.</p><div class="hero-actions"><button class="btn light" onclick="openLesson('${topics.find(t=>!state.done.includes(t.id))?.id||topics[0].id}')">▶ &nbsp;Continuar estudando</button><button class="btn ghost" onclick="setPage('trilha')">Ver minha trilha&nbsp; →</button></div></div><div class="hero-art">✦</div></section><div class="stats"><div class="stat"><div class="stat-icon">📚</div><div><strong>${completed}<small style="font-size:12px;color:#89948d"> / ${topics.length}</small></strong><small> tópicos concluídos</small></div></div><div class="stat"><div class="stat-icon">◷</div><div><strong>${state.quiz}</strong><small> questões respondidas</small></div></div><div class="stat"><div class="stat-icon">🌱</div><div><strong>${pct()}%</strong><small> da trilha concluída</small></div></div></div><div class="section-head"><div><h2>Acervo por matéria</h2><p>Matérias frequentes em concursos; escolha um caminho para começar.</p></div></div><div class="subject-grid">${areasMeta.map(([a,i])=>`<button class="subject-card" onclick="selectArea('${a}')"><span class="subject-emoji">${i}</span><b>${a}</b><small>${topics.filter(t=>t.area===a).length} tópicos · estudar →</small></button>`).join('')}</div><div class="section-head"><div><h2>Comece por Língua Portuguesa</h2><p>${topics.filter(t=>t.area==='Língua Portuguesa').length} tópicos de estudo · conteúdo em blocos curtos.</p></div><button class="text-button" onclick="setPage('trilha')">Ver todos&nbsp; →</button></div><div class="grid">${topics.slice(0,6).map(card).join('')}</div><div class="lower"><section class="panel"><h3>Retome de onde parou</h3><p class="panel-sub">Sugestões para sua próxima sessão</p>${topics.filter(t=>!state.done.includes(t.id)).slice(0,2).map(t=>`<div class="study-row" onclick="openLesson('${t.id}')"><div class="study-dot">${t.icon}</div><div><b>${t.title}</b><small>Leitura guiada · ${t.time}</small></div><span class="arrow">→</span></div>`).join('')||'<p class="panel-sub">Você concluiu todos os tópicos. Que tal revisar?</p>'}</section><section class="panel quiz-panel"><div class="quiz-label">Prática de hoje · 10 questões</div><h3>Aprender também é tentar.</h3><p>Uma sessão curta para testar o que você sabe. Cada resposta traz explicação para aprender com o erro.</p><button class="btn" onclick="setPage('questoes')">Começar prática&nbsp; →</button></section></div><div class="footer-note">Feito para estudar com calma, clareza e constância.</div>`}
else if(page==='trilha'){let list=topics.filter(t=>(selectedArea==='all'||t.area===selectedArea)&&(filter==='all'||t.tag===filter)&&(`${t.title} ${t.desc} ${t.tag}`).toLowerCase().includes(search.toLowerCase()));app.innerHTML=`<div class="eyebrow">${selectedArea==='all'?'Acervo completo':selectedArea} · ${list.length} tópicos</div><h1 class="page-title">Minha trilha</h1><p class="page-intro">Base ampla de estudos para você avançar por matéria e por assunto. Marque tópicos concluídos para acompanhar seu progresso neste navegador.</p><div class="filters"><button class="filter ${filter==='all'?'active':''}" onclick="filter='all';render()">Todos</button>${[...new Set(topics.filter(t=>selectedArea==='all'||t.area===selectedArea).map(t=>t.tag))].map(x=>`<button class="filter ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${list.map(card).join('')||'<div class="empty"><p>Nenhum tópico corresponde a este filtro.</p><button class="btn outline" onclick="filter=\'all\';render()">Mostrar todos os tópicos</button></div>'}</div>`}
else if(page==='revisao'){let list=topics.filter(t=>state.done.includes(t.id));app.innerHTML=`<div class="eyebrow">Fixação sem sobrecarga</div><h1 class="page-title">Revisão espaçada</h1><p class="page-intro">Revisite os assuntos concluídos para fortalecer a memória. Você decide o ritmo.</p><section class="panel" style="max-width:770px">${list.length?list.map(t=>`<div class="study-row" onclick="openLesson('${t.id}')"><div class="study-dot">${t.icon}</div><div><b>${t.title}</b><small>Concluído · toque para revisar</small></div><span class="arrow">Rever →</span></div>`).join(''):'<div class="empty">Seus tópicos concluídos aparecerão aqui. Comece pela trilha de estudos.</div>'}</section>`}
 else if(page==='erros')showMistakes(app);else if(page==='questoes')showQuiz(app);else if(page==='materiais')renderMaterials(app,search);}
function renderMaterials(app,search=''){let q=search.trim().toLocaleLowerCase('pt-BR');let list=materials.filter(m=>(materialArea==='Todas'||m.area===materialArea)&&(!q||`${m.area} ${m.title} ${m.kind} ${m.description} ${m.source}`.toLocaleLowerCase('pt-BR').includes(q)));app.innerHTML=`<div class="eyebrow">Biblioteca externa · ${materials.length} referências</div><h1 class="page-title">Materiais para estudar</h1><p class="page-intro">PDFs, leis e sites de consulta organizados por matéria. Os links abrem em uma nova aba e levam à fonte original.</p><div class="resource-tools"><input id="materialSearch" value="${q.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" placeholder="Buscar por tema, material ou fonte…" aria-label="Buscar materiais"><button class="filter ${materialArea==='Todas'?'active':''}" onclick="materialArea='Todas';renderMaterials(document.getElementById('app'),document.getElementById('materialSearch')?.value||'')">Todas as matérias</button></div><div class="filters">${areasMeta.map(([area])=>`<button class="filter ${materialArea===area?'active':''}" onclick="materialArea='${area}';renderMaterials(document.getElementById('app'),document.getElementById('materialSearch')?.value||'')">${area}</button>`).join('')}</div><div class="grid">${list.map(m=>`<article class="resource-card"><span class="tag">${m.kind}</span><h3>${m.title}</h3><p>${m.description}</p><a href="${m.url}" target="_blank" rel="noopener noreferrer">Abrir na fonte · ${m.source} ↗</a><span style="font-size:9px;color:#98a19c;margin-top:7px">${m.area}</span></article>`).join('')||'<div class="empty">Nenhum material encontrado. Tente outro assunto.</div>'}</div><div class="resource-note"><b>Como aproveitar:</b> estude os materiais em etapas curtas, pratique com questões e revise os pontos difíceis. Em legislação, prefira a versão oficial compilada e atualizada.</div><div class="footer-note">Links externos podem mudar. A Rota direciona à página da fonte e não hospeda os arquivos.</div>`;document.getElementById('materialSearch')?.addEventListener('input',e=>{const value=e.target.value;renderMaterials(document.getElementById('app'),value);const next=document.getElementById('materialSearch');next?.focus();next?.setSelectionRange(value.length,value.length)});}
function openLesson(id){let t=topics.find(x=>x.id===id);if(!t)return;page='lesson';document.getElementById('crumb').textContent=t.title;document.getElementById('app').innerHTML=`<button class="text-button" onclick="setPage('trilha')">← Voltar para trilha</button><article class="lesson"><div class="eyebrow">${t.tag} · Leitura guiada · ${t.time}</div><h2>${t.icon} ${t.title}</h2>${t.body}<div class="lesson-actions"><button class="btn primary" onclick="completeTopic('${t.id}')">✓ Marcar como concluído</button><button class="btn outline" onclick="openTopicMaterials('${t.id}')">Ver materiais gratuitos ↗</button></div>${window.rotaTopicExtras?window.rotaTopicExtras.render(t):''}<p style="font-size:10px;color:#8b968f;margin-top:18px">Material complementar de estudo. Em legislação, consulte também o texto oficial vigente.</p></article>`}
function openTopicMaterials(id){const source=document.getElementById(`topic-resources-${id}`);if(!source){toast('Os materiais deste tópico ainda não foram carregados.');return}let modal=document.getElementById('topicMaterialsModal');if(!modal){modal=document.createElement('div');modal.id='topicMaterialsModal';modal.className='materials-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Materiais gratuitos do tópico');document.body.append(modal)}modal.innerHTML=`<button class="materials-modal-backdrop" aria-label="Fechar materiais" onclick="closeTopicMaterials()"></button><section class="materials-modal-card"><button class="materials-modal-close" onclick="closeTopicMaterials()">Fechar ×</button>${source.innerHTML}</section>`;modal.classList.add('open')}
function closeTopicMaterials(){document.getElementById('topicMaterialsModal')?.classList.remove('open')}
function completeTopic(id){if(!state.done.includes(id))state.done.push(id);save();toast('Progresso salvo. Bom trabalho!');setTimeout(()=>setPage('trilha'),350)}
function showQuiz(app){if(sessionAnswers>=10){app.innerHTML=`<section class="quiz-box"><div class="eyebrow">Sessão finalizada</div><h1 class="page-title">Você chegou até o fim! 🌱</h1><p class="page-intro">Acertou ${sessionScore} de 10 questões. ${sessionScore>=7?'Ótimo resultado. Faça uma revisão rápida dos temas que deram trabalho.':'Cada erro virou uma pista do que revisar. Volte à trilha e tente novamente quando quiser.'}</p><div class="stats"><div class="stat"><div class="stat-icon">✓</div><div><strong>${sessionScore}/10</strong><small> acertos</small></div></div><div class="stat"><div class="stat-icon">✳</div><div><strong>${questions.length}</strong><small> questões inéditas</small></div></div></div><button class="btn primary" onclick="qIndex++;sessionAnswers=0;sessionScore=0;render()">Nova sessão →</button><button class="btn outline" onclick="setPage('trilha')">Revisar conteúdos</button></section>`;return}let q=questions[qIndex%questions.length];app.innerHTML=`<div class="eyebrow">Questões rápidas · ${sessionAnswers+1} de 10 · banco com ${questions.length}</div><h1 class="page-title">Pratique sem pressão</h1><p class="page-intro">Leia com atenção e use o feedback para entender o raciocínio.</p><div class="progress-line" style="max-width:720px;margin-bottom:15px"><i style="width:${sessionAnswers*10}%"></i></div><section class="quiz-box"><div style="font-size:10px;color:#839087">QUESTÃO ${String(sessionAnswers+1).padStart(2,'0')}</div><h3 style="font:700 18px Manrope;line-height:1.5;margin:12px 0 20px">${q.q}</h3>${q.a.map((a,i)=>`<div class="answer" onclick="answer(this,${i},${q.correct})"><b>${String.fromCharCode(65+i)}.</b>${a}</div>`).join('')}<div id="feedback"></div><button id="nextQ" class="btn primary" style="display:none;margin-top:14px" onclick="qIndex++;render()">${sessionAnswers===9?'Ver resultado':'Próxima questão →'}</button></section>`}
function showMistakes(app){const items=state.mistakes||[];app.innerHTML=`<div class="eyebrow">Revisão pessoal · ${items.length} ${items.length===1?'questão':'questões'}</div><h1 class="page-title">Caderno de erros</h1><p class="page-intro">As questões que você errou ficam guardadas aqui com a resposta certa e a explicação. Refaça o raciocínio quando estiver pronto.</p>${items.length?`<div class="grid">${items.map((m,i)=>`<article class="panel"><span class="tag">Questão para revisar</span><h3 style="margin-top:12px">${m.q}</h3><p class="panel-sub">Sua resposta: ${m.answers[m.selected]}</p><div class="feedback"><b>Resposta correta:</b> ${m.answers[m.correct]}<br>${m.why}</div><button class="btn outline" style="margin-top:12px" onclick="removeMistake(${i})">Remover após revisar</button></article>`).join('')}</div>`:`<section class="panel" style="max-width:760px"><h3>Seu caderno está vazio 🌱</h3><p class="panel-sub">Ao errar uma questão, ela será salva aqui com a explicação para você revisar.</p><button class="btn primary" onclick="setPage('questoes')">Praticar questões →</button></section>`}`}
function removeMistake(index){state.mistakes.splice(index,1);save();render()}
function answer(el,i,correct){if(document.querySelector('.answer.correct,.answer.wrong'))return;const question=questions[qIndex%questions.length];state.quiz++;sessionAnswers++;if(i===correct)sessionScore++;else{const previous=state.mistakes.find(m=>m.q===question.q);const mistake={q:question.q,answers:question.a,selected:i,correct,why:question.why};if(previous)Object.assign(previous,mistake);else state.mistakes.unshift(mistake)}save();document.querySelectorAll('.answer')[correct].classList.add('correct');if(i!==correct)el.classList.add('wrong');document.getElementById('feedback').innerHTML=`<div class="feedback"><b>${i===correct?'Isso mesmo!':'Vamos entender:'}</b> ${question.why}</div>`;document.getElementById('nextQ').style.display='inline-flex'}
renderSubjectNav();render();
</script></body></html>
