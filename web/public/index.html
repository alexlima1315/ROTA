<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">↗</div><div>ROTA<small>estudo com direção</small></div></div><div class="nav-label">Seu espaço</div><nav class="nav"><button data-page="home" class="active"><span>⌂</span>Visão geral</button><button data-page="trilha"><span>▤</span>Minha trilha</button><button data-page="revisao"><span>◷</span>Revisão espaçada</button><button data-page="questoes"><span>✳</span>Questões rápidas</button><button data-page="erros"><span>↺</span>Caderno de erros</button><button data-page="materiais"><span>↗</span>Biblioteca de materiais</button></nav><div class="nav-label" style="margin-top:27px">Matérias</div><nav class="nav" id="subjectNav"></nav><div class="sidebar-bottom"><div class="mini-plan"><b>Um passo por vez 🌱</b><p>Estudar um pouco hoje já conta. Sua constância vale mais que a pressa.</p><div class="progress-line"><i id="sideProgress" style="width:0%"></i></div></div><div style="padding:18px 12px 0;color:#98a19c;font-size:10px">ROTA · versão de estudos</div></div></aside><main class="main"><header class="topbar"><div class="crumb"><button class="mobile-menu" id="menuBtn">☰</button><span>Área de estudos&nbsp; / &nbsp;<b id="crumb">Visão geral</b></span></div><div class="top-right"><div class="search"><input id="search" placeholder="Buscar assunto..." aria-label="Buscar assunto"><em>⌕</em></div><div class="avatar">AL</div></div></header><div class="content" id="app"></div></main></div>
<script src="./topic-content.js?v=20261029-english"></script><script>
const topics=[
{id:'interpretacao',title:'Compreensão e interpretação',icon:'🔎',tag:'Leitura',desc:'Encontre o que o texto diz e o que permite concluir.',time:'12 min',progress:0,source:'',body:`<p>Interpretar é construir sentido a partir do texto. A resposta precisa se apoiar nas palavras, nas relações entre as ideias e no contexto apresentado.</p><div class="callout"><b>Atalho de prova:</b> se a questão pergunta o que está explícito, volte ao trecho. Se pede inferência, una pistas do texto sem acrescentar opinião pessoal.</div><h3>Um método em três passos</h3><ol><li>Leia o comando e identifique exatamente o que ele pede.</li><li>Localize no texto as palavras ou ideias relacionadas.</li><li>Compare cada alternativa com o trecho: cuidado com exageros como “sempre”, “nunca” e “somente”.</li></ol><p><b>Exemplo:</b> “Joana levou um guarda-chuva; o céu estava carregado.” Podemos inferir que ela se preparou para uma possível chuva. Não podemos afirmar que choveu.</p>`},
{id:'tipologias',title:'Tipologias e gêneros textuais',icon:'🧩',tag:'Estrutura',desc:'Reconheça o objetivo e a organização de cada texto.',time:'10 min',progress:0,source:'',body:`<p>Tipologia é a forma de organização predominante; gênero é o formato social usado para comunicar. Um mesmo gênero pode combinar mais de uma tipologia.</p><div class="callout"><b>Para memorizar:</b> narração conta acontecimentos; descrição caracteriza; exposição explica; argumentação defende uma ideia; injunção orienta uma ação.</div><h3>Como identificar</h3><ul><li><b>Narrativo:</b> ações, personagens, tempo e espaço.</li><li><b>Descritivo:</b> características, estados e detalhes.</li><li><b>Expositivo:</b> apresentação e explicação de informações.</li><li><b>Argumentativo:</b> tese acompanhada de razões e evidências.</li><li><b>Injuntivo:</b> instruções, ordens ou recomendações.</li></ul><p>Notícia, receita, artigo de opinião e conto são gêneros. Observe a finalidade e a estrutura, não apenas o nome.</p>`},
{id:'coesao',title:'Coesão, coerência e semântica',icon:'🔗',tag:'Sentido',desc:'Conecte ideias e perceba como as escolhas mudam o sentido.',time:'14 min',progress:0,source:'',body:`<p><b>Coesão</b> é a ligação entre partes do texto. <b>Coerência</b> é a construção de um sentido compatível com as ideias e o contexto.</p><div class="callout"><b>Exemplo:</b> “Pedro estudou bastante, portanto foi aprovado.” O conectivo “portanto” indica consequência. Trocar por “embora” muda a relação lógica.</div><h3>Ferramentas frequentes</h3><ul><li><b>Referência:</b> pronomes e expressões retomam ou antecipam termos.</li><li><b>Conectivos:</b> mostram causa, oposição, conclusão, condição e outras relações.</li><li><b>Semântica:</b> estuda sentidos; denotação é sentido literal, conotação é figurado.</li></ul><p>Na reescrita, confira se a troca preserva o sentido, a correção gramatical e a relação entre as ideias.</p>`},
{id:'figuras',title:'Figuras de linguagem',icon:'🎭',tag:'Expressividade',desc:'Entenda os efeitos de sentido por trás das expressões.',time:'8 min',progress:0,source:'',body:`<p>Figuras de linguagem criam efeitos expressivos. A questão costuma cobrar o efeito produzido no contexto, além do nome da figura.</p><div class="callout"><b>Metáfora:</b> aproxima sentidos sem usar conectivo comparativo. “Aquela notícia foi um balde de água fria.” A expressão indica frustração ou desânimo.</div><ul><li><b>Comparação:</b> aproximação explícita, geralmente com “como”.</li><li><b>Hipérbole:</b> exagero intencional.</li><li><b>Personificação:</b> atribui ação ou característica humana a algo não humano.</li><li><b>Ironia:</b> sentido pretendido pode contrastar com o literal; o contexto é decisivo.</li></ul>`},
{id:'vicios',title:'Vícios de linguagem e reescrita',icon:'✍️',tag:'Revisão',desc:'Identifique ruídos e preserve o sentido ao reescrever.',time:'11 min',progress:0,source:'',body:`<p>Na análise de vícios de linguagem, observe se a construção gera ambiguidade, repetição desnecessária ou dificuldade de compreensão. Em reescrita, uma frase pode mudar de forma sem perder a ideia original.</p><div class="callout"><b>Checklist:</b> o referente continua claro? O conectivo mantém a relação lógica? A nova frase preserva tempo, modo e intenção? A concordância permanece adequada?</div><p>Leia a versão original e a proposta em sequência. Teste o significado no contexto, e não palavra por palavra.</p>`},
{id:'pressupostos',title:'Pressupostos e subentendidos',icon:'🕵️',tag:'Leitura',desc:'Descubra informações sugeridas sem confundir pistas e opinião.',time:'9 min',source:'',body:`<p>Uma informação explícita aparece diretamente. A inferência é uma conclusão apoiada em pistas. Pressupostos são conteúdos sugeridos por certas palavras e construções; subentendidos dependem mais do contexto e da intenção comunicativa.</p><div class="callout"><b>Exemplo:</b> “Marina voltou a estudar.” O verbo “voltou” pressupõe que ela já estudava antes. Já concluir por que ela parou exigiria contexto adicional.</div><h3>Como resolver</h3><ol><li>Sublinhe a palavra que dispara a sugestão (voltou, ainda, até, deixou de).</li><li>Separe o que a frase garante do que ela apenas sugere.</li><li>Não transforme uma possibilidade em certeza sem apoio textual.</li></ol>`},
{id:'funcoes',title:'Funções da linguagem',icon:'📣',tag:'Leitura',desc:'Perceba onde está o foco: mensagem, leitor, contexto ou código.',time:'8 min',source:'',body:`<p>As funções da linguagem indicam o foco predominante da comunicação. Um texto pode combinar funções; a prova costuma pedir a que mais se destaca no trecho.</p><ul><li><b>Referencial:</b> informa sobre o contexto ou assunto.</li><li><b>Emotiva:</b> destaca sentimentos e ponto de vista de quem fala.</li><li><b>Conativa:</b> busca influenciar o leitor, como em campanhas e instruções.</li><li><b>Fática:</b> testa ou mantém o canal de comunicação.</li><li><b>Metalinguística:</b> usa a linguagem para falar dela mesma.</li><li><b>Poética:</b> valoriza a forma e a construção da mensagem.</li></ul><div class="callout"><b>Dica:</b> pergunte “o que o texto está tentando fazer aqui?” em vez de classificar pelo gênero inteiro.</div>`},
{id:'intertextualidade',title:'Intertextualidade e vozes',icon:'🗣️',tag:'Leitura',desc:'Reconheça citações, referências e diferentes pontos de vista.',time:'9 min',source:'',body:`<p>Intertextualidade ocorre quando um texto dialoga com outro. O diálogo pode ser direto, por citação, ou indireto, por alusão, paródia e retomada de ideias.</p><div class="callout"><b>Na prova:</b> identifique quem está falando, qual voz é retomada e que efeito a referência produz no texto atual. Citar uma opinião não significa necessariamente concordar com ela.</div><p>Observe aspas, verbos de dizer, expressões conhecidas e mudanças de tom. Depois, explique a função da referência no contexto.</p>`},
{id:'variacao',title:'Níveis e variação linguística',icon:'🌎',tag:'Linguagem',desc:'Entenda como contexto, região e situação afetam os usos da língua.',time:'10 min',source:'',body:`<p>A língua varia conforme região, grupo social, época e situação comunicativa. A escolha adequada depende do contexto e do objetivo; variedades diferentes não significam, por si só, falta de capacidade linguística.</p><div class="callout"><b>Registro formal:</b> tende a ser usado em situações monitoradas, como documentos oficiais. <b>Registro informal:</b> é comum em conversas espontâneas. Ambos podem ser adequados em seus contextos.</div><p>Em questões, evite julgar o falante. Observe quem se comunica, com quem, em qual situação e com que finalidade.</p>`},
{id:'generos',title:'Gêneros textuais no cotidiano',icon:'📰',tag:'Estrutura',desc:'Diferencie o formato social do texto de sua tipologia predominante.',time:'9 min',source:'',body:`<p>Gêneros são formas relativamente estáveis de comunicação, ligadas a propósitos e situações concretas: notícia, receita, e-mail, edital, crônica, artigo de opinião e muitos outros.</p><div class="callout"><b>Não confunda:</b> gênero é o “tipo de documento” (uma notícia); tipologia é o modo de organização predominante (frequentemente expositivo ou narrativo).</div><p>Para reconhecer o gênero, analise finalidade, público, circulação e estrutura. Um gênero pode misturar descrição, exposição e argumentação.</p>`},
{id:'narracao',title:'Narração e tipos de discurso',icon:'📖',tag:'Estrutura',desc:'Acompanhe ações, narrador e formas de apresentar falas.',time:'10 min',source:'',body:`<p>A narração organiza acontecimentos com participantes, ações, tempo e espaço. O narrador pode participar da história ou contar os fatos de fora.</p><ul><li><b>Discurso direto:</b> reproduz a fala como fala da personagem.</li><li><b>Discurso indireto:</b> o narrador relata a fala, ajustando pronomes e tempos verbais.</li><li><b>Indireto livre:</b> mistura a voz do narrador e a perspectiva da personagem sem marca explícita.</li></ul><div class="callout">A mudança de discurso pode alterar pronomes, advérbios e tempos. Compare quem fala e de onde o fato é observado.</div>`},
{id:'argumentacao',title:'Argumentação, evidências e falácias',icon:'⚖️',tag:'Estrutura',desc:'Separe tese, razões e evidências; avalie a força do argumento.',time:'12 min',source:'',body:`<p>Um texto argumentativo apresenta uma tese e tenta sustentá-la com razões, exemplos, dados ou autoridades pertinentes. Evidência precisa ter relação com a conclusão e ser confiável.</p><div class="callout"><b>Raciocínio dedutivo:</b> parte de uma regra geral e aplica a um caso. <b>Indutivo:</b> observa casos e propõe uma generalização, que pode ser provável sem ser certa.</div><p>Falácias são raciocínios que parecem convincentes, mas têm problemas. Desconfie de ataques pessoais, falsas escolhas (“ou isso ou aquilo”) e conclusões gerais tiradas de poucos casos.</p><p><b>Na questão:</b> localize a tese, marque as justificativas e pergunte se as evidências realmente sustentam a conclusão.</p>`},
{id:'injuncao',title:'Exposição, descrição e injunção',icon:'🧭',tag:'Estrutura',desc:'Reconheça quando o texto explica, caracteriza ou orienta.',time:'9 min',source:'',body:`<p>Textos reais combinam modos de organização. Identifique o predominante observando o que as frases fazem.</p><ul><li><b>Expositivo:</b> apresenta conceitos, informações ou explicações.</li><li><b>Descritivo:</b> destaca atributos, estados e detalhes.</li><li><b>Injuntivo:</b> orienta o leitor por instruções, recomendações ou comandos.</li><li><b>Dialogal:</b> organiza trocas entre interlocutores.</li></ul><div class="callout"><b>Teste rápido:</b> “como fazer?” costuma indicar injunção; “o que é/como funciona?” aponta para exposição; “como é?” aponta para descrição.</div>`},
{id:'semantica',title:'Sentido: sinônimos, polissemia e homonímia',icon:'🔤',tag:'Sentido',desc:'Use o contexto para entender palavras e relações de significado.',time:'10 min',source:'',body:`<p>O sentido de uma palavra depende do contexto. Sinônimos têm sentidos próximos, mas raramente podem ser trocados em qualquer frase sem mudança de tom ou significado.</p><ul><li><b>Antonímia:</b> relação de oposição entre sentidos.</li><li><b>Polissemia:</b> uma palavra apresenta sentidos relacionados em usos diferentes.</li><li><b>Homonímia:</b> palavras com mesma forma (som e/ou escrita) e significados distintos.</li></ul><div class="callout"><b>Estratégia:</b> substitua a palavra pela alternativa e releia a frase inteira. Confira se o sentido e a combinação com as outras palavras continuam naturais.</div>`},
{id:'conectivos',title:'Conectivos e coesão sequencial',icon:'🔀',tag:'Sentido',desc:'Leia as relações de causa, contraste, condição e conclusão.',time:'10 min',source:'',body:`<p>Conectivos orientam a leitura e mostram como uma ideia se relaciona com outra. O valor depende do contexto, não apenas da palavra isolada.</p><ul><li><b>Causa:</b> porque, visto que.</li><li><b>Consequência/conclusão:</b> por isso, portanto.</li><li><b>Oposição/concessão:</b> mas, porém, embora.</li><li><b>Condição:</b> se, caso.</li><li><b>Finalidade:</b> para que, a fim de que.</li></ul><div class="callout">Se a questão propõe trocar um conectivo, pergunte se a relação lógica permanece igual. “Estudou, mas errou” e “estudou, portanto errou” não expressam a mesma relação.</div>`},
{id:'referencia',title:'Referência, pronomes e retomadas',icon:'🧵',tag:'Sentido',desc:'Descubra a que termo cada pronome ou expressão se refere.',time:'9 min',source:'',body:`<p>A coesão referencial evita repetir nomes o tempo todo. Pronomes, sinônimos e expressões resumidoras podem retomar ou antecipar informações.</p><div class="callout"><b>Exemplo:</b> “A equipe revisou o relatório. Ela o enviará amanhã.” “Ela” retoma “a equipe”; “o” retoma “o relatório”.</div><p>Quando houver mais de um candidato, confira concordância, sentido e proximidade. Se a referência ficar ambígua, há um problema de clareza.</p>`},
{id:'reescrita',title:'Reescrita, paralelismo e verbos',icon:'📝',tag:'Revisão',desc:'Avalie se a nova frase mantém sentido, estrutura e relações verbais.',time:'12 min',source:'',body:`<p>Uma reescrita correta preserva a informação essencial e mantém a frase gramatical. Não basta trocar palavras por sinônimos: mudanças de voz, tempo, negação e conectivo podem alterar o sentido.</p><div class="callout"><b>Paralelismo:</b> elementos coordenados devem manter formas compatíveis. “Gosta de ler, escrever e de viajar” pode ser ajustado para “gosta de ler, de escrever e de viajar”.</div><p>Observe também tempos e modos verbais. Em questões de equivalência, releia o período completo e verifique quem pratica a ação, quando ela ocorre e com que grau de certeza.</p>`}
];

{id:'fracao',area:'Matemática',title:'Frações e números decimais',icon:'➗',tag:'Fundamentos',desc:'Entenda partes de um todo e operações sem decorar no escuro.',time:'12 min',body:`<p>Uma fração representa partes iguais de um todo. Em 3/4, o denominador 4 divide o todo em quatro partes iguais; o numerador 3 indica quantas partes consideramos.</p><div class="callout"><b>Exemplo:</b> 1/2 = 0,5 = 50%. São três maneiras de expressar a mesma quantidade.</div><h3>Operações essenciais</h3><ul><li>Para somar frações com denominadores iguais, some os numeradores.</li><li>Com denominadores diferentes, transforme em frações equivalentes com denominador comum.</li><li>Para multiplicar, multiplique numerador por numerador e denominador por denominador.</li><li>Na divisão, multiplique pela fração inversa.</li></ul><p>Simplifique a fração quando numerador e denominador tiverem divisor comum.</p>`},
{id:'porcentagem',area:'Matemática',title:'Porcentagem e descontos',icon:'％',tag:'Fundamentos',desc:'Calcule aumentos, descontos e variações em etapas simples.',time:'11 min',body:`<p>Porcentagem significa “por cem”. Assim, 15% = 15/100 = 0,15. Para calcular 15% de 200, fazemos 0,15 × 200 = 30.</p><div class="callout"><b>Desconto:</b> um produto de R$ 80 com 25% de desconto cai R$ 20; o novo preço é R$ 60. Multiplicar por 0,75 também encontra diretamente o preço final.</div><p>Em aumentos sucessivos, não some os percentuais automaticamente: cada taxa incide sobre uma base diferente. Aumento de 10% seguido de desconto de 10% não retorna ao valor inicial.</p><h3>Cheque a base</h3><p>Questões podem perguntar o valor percentual, o valor final ou a diferença. Leia qual número representa o “todo” antes de calcular.</p>`},
{id:'proporcao',area:'Matemática',title:'Razão, proporção e regra de três',icon:'⚖️',tag:'Fundamentos',desc:'Resolva relações proporcionais identificando o que varia junto.',time:'13 min',body:`<p>Razão compara duas quantidades por divisão. Uma proporção é a igualdade entre duas razões. A regra de três organiza valores proporcionais quando conhecemos três deles.</p><div class="callout"><b>Exemplo direto:</b> 2 cadernos custam R$ 18. Mantido o mesmo preço por caderno, 5 custam 18 × 5 ÷ 2 = R$ 45.</div><p>Antes da conta, pergunte: quando uma grandeza aumenta, a outra também aumenta (direta) ou diminui (inversa)? Em uma relação inversa, o produto costuma permanecer constante; por exemplo, mais trabalhadores podem reduzir o tempo para uma tarefa, se todo o resto for igual.</p>`},
{id:'medidas',area:'Matemática',title:'Média, unidades e problemas',icon:'📏',tag:'Fundamentos',desc:'Traduza enunciados para operações e confira as unidades.',time:'12 min',body:`<p>A média aritmética simples é a soma dos valores dividida pela quantidade. Se as notas são 6, 7 e 8, a média é 21 ÷ 3 = 7.</p><div class="callout"><b>Unidades:</b> 1 km = 1.000 m; 1 hora = 60 minutos; 1 kg = 1.000 g. Converta antes de operar grandezas que estejam em unidades diferentes.</div><p>Nos problemas, destaque os dados, a pergunta e a unidade da resposta. Faça uma estimativa: se a resposta for um tempo negativo ou uma distância enorme sem sentido, revise a montagem.</p>`},
{id:'proposicoes',area:'Raciocínio Lógico',title:'Proposições e conectivos',icon:'◉',tag:'Lógica',desc:'Identifique afirmações que podem ser julgadas verdadeiras ou falsas.',time:'12 min',body:`<p>Proposição é uma frase declarativa à qual se pode atribuir valor verdadeiro ou falso. Perguntas, ordens e frases abertas como “x é maior que 5” não são proposições completas sem definir x.</p><ul><li><b>Não (¬p):</b> inverte o valor lógico.</li><li><b>p e q:</b> só é verdadeira quando ambas são verdadeiras.</li><li><b>p ou q:</b> no “ou” inclusivo, basta uma ser verdadeira.</li><li><b>Se p, então q:</b> só é falsa quando p é verdadeira e q falsa.</li></ul><div class="callout">Uma tabela-verdade lista as combinações possíveis para testar uma expressão lógica.</div>`},
{id:'negacao',area:'Raciocínio Lógico',title:'Negação e equivalências',icon:'↔',tag:'Lógica',desc:'Negue frases compostas sem cair na armadilha do “não” isolado.',time:'11 min',body:`<p>A negação de “todos os candidatos chegaram” é “pelo menos um candidato não chegou”, e não “nenhum candidato chegou”. A negação de “algum candidato faltou” é “nenhum candidato faltou”.</p><div class="callout"><b>Lei de De Morgan:</b> negar “p e q” equivale a “não p ou não q”. Negar “p ou q” equivale a “não p e não q”.</div><p>“Se p, então q” é equivalente a “não p ou q”. A contrapositiva “se não q, então não p” também é equivalente à condicional original.</p><p>Use um exemplo concreto para conferir cada equivalência antes de memorizar.</p>`},
{id:'sequencias',area:'Raciocínio Lógico',title:'Sequências, conjuntos e padrões',icon:'🔢',tag:'Lógica',desc:'Procure a regra antes de escolher o próximo elemento.',time:'10 min',body:`<p>Em sequências numéricas, compare diferenças entre termos; se elas mudarem, compare as diferenças das diferenças. Também verifique multiplicação, alternância de regras e repetição de blocos.</p><div class="callout"><b>Exemplo:</b> 3, 6, 9, 12… soma-se 3 a cada termo; o próximo é 15.</div><p>Em conjuntos, união reúne elementos que pertencem a pelo menos um conjunto; interseção reúne os que pertencem a ambos. Diagramas de Venn ajudam a contar sem duplicar elementos.</p><p>Não conclua uma regra só porque ela explica dois termos. Teste-a nos demais.</p>`},
{id:'informatica-arquivos',area:'Informática',title:'Arquivos, pastas e segurança digital',icon:'💻',tag:'Tecnologia',desc:'Domine conceitos de uso cotidiano cobrados em provas.',time:'11 min',body:`<p>Arquivo guarda dados; pasta organiza arquivos e outras pastas. Extensões como .pdf, .docx e .xlsx indicam formatos, mas não garantem que um arquivo seja seguro.</p><ul><li><b>Backup:</b> cópia de segurança para recuperação após perda ou dano.</li><li><b>Nuvem:</b> armazenamento acessado pela internet, sujeito a conta e permissões.</li><li><b>Phishing:</b> tentativa de obter dados por mensagem ou página enganosa.</li><li><b>Autenticação em dois fatores:</b> combina a senha com uma segunda prova de identidade.</li></ul><div class="callout">Desconfie de urgência, remetente inesperado e links que pedem senha. Acesse o serviço pelo endereço conhecido em vez de clicar.</div>`},
{id:'planilhas',area:'Informática',title:'Planilhas: células e fórmulas',icon:'▦',tag:'Tecnologia',desc:'Leia referências, intervalos e funções básicas de planilha.',time:'10 min',body:`<p>Uma planilha organiza dados em linhas e colunas. A célula é identificada pela coluna e pela linha, como B3. Um intervalo como A1:A5 reúne células consecutivas.</p><ul><li>Fórmulas geralmente começam com sinal de igual.</li><li>Uma soma pode usar uma função ou adicionar valores diretamente.</li><li>Referência relativa muda ao copiar a fórmula; referência absoluta mantém fixa a linha, coluna ou ambas.</li></ul><div class="callout"><b>Exemplo:</b> =SOMA(B2:B6) soma os valores do intervalo. O nome e separador de funções podem variar conforme idioma e programa.</div><p>Filtros mudam quais linhas aparecem; ordenação reorganiza a sequência dos dados. Não confunda uma coisa com a outra.</p>`},
{id:'internet',area:'Informática',title:'Internet, e-mail e navegação segura',icon:'🌐',tag:'Tecnologia',desc:'Entenda navegador, endereço, busca e boas práticas de comunicação.',time:'9 min',body:`<p>Navegador é o programa que acessa páginas. Um mecanismo de busca ajuda a localizar conteúdo, mas não é a própria internet. URL é o endereço de um recurso.</p><ul><li><b>Para:</b> destinatário principal da mensagem.</li><li><b>CC:</b> cópia visível aos destinatários.</li><li><b>CCO:</b> cópia oculta para os demais destinatários.</li><li><b>Anexo:</b> arquivo enviado com a mensagem.</li></ul><p>HTTPS protege a comunicação entre navegador e site, mas não prova que o site é confiável. Confira domínio, contexto e pedido de dados.</p>`},
{id:'const-fundamentos',area:'Direito Constitucional',title:'Constituição: fundamentos e organização',icon:'🏛️',tag:'Direito',desc:'Comece pelos fundamentos da República e organização dos Poderes.',time:'13 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>A Constituição organiza o Estado, limita o exercício do poder e protege direitos. O artigo 1º apresenta fundamentos da República Federativa do Brasil, como soberania, cidadania e dignidade da pessoa humana. O artigo 2º prevê Legislativo, Executivo e Judiciário independentes e harmônicos.</p><div class="callout"><b>Jeito simples:</b> fundamento é base do Estado; objetivo é uma meta constitucional. Não troque as listas entre os artigos 1º e 3º.</div><p>Federação distribui competências entre União, estados, Distrito Federal e municípios. Para estudo de prova, leia o texto constitucional vigente e o recorte indicado no edital.</p><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noreferrer">Consultar Constituição no Planalto ↗</a>`},
{id:'const-direitos',area:'Direito Constitucional',title:'Direitos e garantias fundamentais',icon:'🛡️',tag:'Direito',desc:'Organize os direitos fundamentais e aprenda a localizar o artigo.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>O artigo 5º reúne direitos e garantias individuais e coletivos. A Constituição também trata de direitos sociais, nacionalidade, direitos políticos e partidos políticos em capítulos próprios.</p><div class="callout"><b>Estratégia:</b> para cada questão, identifique o direito envolvido, a regra constitucional e se o próprio texto prevê condições ou exceções. Não memorize frases soltas fora do contexto.</div><p>Liberdades e garantias protegem pessoas e orientam a atuação estatal. A aplicação concreta pode depender do texto constitucional e da interpretação jurídica; em prova objetiva, use o que o edital e a questão delimitam.</p><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noreferrer">Ler o texto constitucional atualizado ↗</a>`},
{id:'const-administracao',area:'Direito Constitucional',title:'Administração Pública na Constituição',icon:'🏢',tag:'Direito',desc:'Estude princípios e regras constitucionais para agentes públicos.',time:'12 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>O artigo 37 determina princípios expressos para a Administração Pública: legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE). A regra alcança a administração direta e indireta dos entes federativos.</p><div class="callout"><b>Em linguagem direta:</b> atuar conforme a lei; sem favorecimentos; com probidade; dando transparência nos termos legais; e buscando bons resultados.</div><p>A Constituição também trata de concurso público, cargos, empregos e funções, acumulação e responsabilidades. Os detalhes variam conforme o regime e a legislação aplicável. Consulte o artigo completo e o edital.</p><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noreferrer">Consultar Constituição ↗</a>`},
{id:'const-poderes',area:'Direito Constitucional',title:'Poderes, funções e controle',icon:'⚖️',tag:'Direito',desc:'Entenda funções típicas e como os Poderes se relacionam.',time:'10 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>Legislativo, Executivo e Judiciário têm funções típicas, mas também exercem funções atípicas previstas na Constituição. A independência entre eles convive com mecanismos de controle recíproco.</p><div class="callout"><b>Mapa inicial:</b> Legislativo cria leis e fiscaliza; Executivo administra e executa políticas; Judiciário resolve conflitos aplicando o direito. Essa síntese não substitui as competências constitucionais detalhadas.</div><p>Questões podem confundir função típica com atribuição específica. Procure o órgão, a competência expressa e o dispositivo constitucional.</p><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noreferrer">Ler a Constituição ↗</a>`},
{id:'adm-principios',area:'Direito Administrativo',title:'Princípios e organização administrativa',icon:'📋',tag:'Direito',desc:'Separe administração direta, indireta e os princípios básicos.',time:'13 min',body:`<p>Administração direta reúne órgãos da própria pessoa política. Administração indireta reúne entidades com personalidade jurídica própria, criadas ou autorizadas por lei para finalidades específicas, como autarquias e empresas estatais.</p><div class="callout"><b>Princípios expressos na Constituição:</b> legalidade, impessoalidade, moralidade, publicidade e eficiência. Outros princípios são construídos pelo ordenamento e pela doutrina; verifique como o edital delimita o tema.</div><p>Órgão é unidade de atuação sem personalidade jurídica própria; entidade é pessoa jurídica. Essa distinção aparece com frequência em questões conceituais.</p>`},
{id:'adm-atos',area:'Direito Administrativo',title:'Atos administrativos: noções iniciais',icon:'🖊️',tag:'Direito',desc:'Conheça elementos, atributos e diferenças entre ato e fato.',time:'14 min',body:`<p>Ato administrativo é uma manifestação da Administração submetida a regras de direito público e voltada a produzir efeitos jurídicos. Como esquema de estudo, revise competência, finalidade, forma, motivo e objeto.</p><div class="callout"><b>Macete de análise:</b> quem praticou? para quê? como? com base em quais fatos e regras? qual efeito? Essa sequência ajuda a localizar possíveis vícios.</div><p>Presunção de legitimidade, imperatividade e autoexecutoriedade são atributos frequentemente estudados, mas não estão presentes da mesma forma em todo ato. Revogação trata de conveniência e oportunidade; anulação, de ilegalidade, conforme a disciplina aplicável.</p>`},
{id:'adm-poderes',area:'Direito Administrativo',title:'Poderes e deveres da Administração',icon:'🔧',tag:'Direito',desc:'Entenda poderes como instrumentos com finalidade pública.',time:'12 min',body:`<p>Poderes administrativos são instrumentos para cumprir deveres públicos e não privilégios pessoais. Entre os temas comuns estão poder hierárquico, disciplinar, regulamentar e de polícia.</p><ul><li><b>Hierárquico:</b> organiza e distribui funções na estrutura administrativa.</li><li><b>Disciplinar:</b> apura infrações e aplica sanções a quem está sujeito ao regime pertinente.</li><li><b>Regulamentar:</b> permite expedir atos normativos subordinados à lei.</li><li><b>Polícia:</b> condiciona ou restringe direitos nos limites legais em benefício coletivo.</li></ul><div class="callout">Abuso de poder pode aparecer como excesso de poder (ultrapassa competência) ou desvio de finalidade (usa competência para fim inadequado).</div>`},
{id:'adm-licitacoes',area:'Direito Administrativo',title:'Licitações e contratos: noções gerais',icon:'📑',tag:'Direito',desc:'Compreenda a finalidade da licitação e consulte a lei vigente.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm',body:`<p>Licitação é o procedimento destinado a selecionar proposta apta a atender ao interesse público, com isonomia e observância das regras legais. A Lei nº 14.133/2021 estabelece normas gerais de licitações e contratos administrativos para os entes que ela abrange.</p><div class="callout"><b>Para estudar:</b> confira no edital a lei, os artigos e eventuais normas locais cobradas. A legislação pode ser alterada; use sempre a versão oficial atualizada.</div><p>Este resumo é uma porta de entrada, não substitui a leitura da lei. Comece por princípios, fases, modalidades, contratação direta e gestão contratual somente se estiverem no seu programa.</p><a href="https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm" target="_blank" rel="noreferrer">Consultar Lei 14.133/2021 no Planalto ↗</a>`},
{id:'etica-publica',area:'Ética no Serviço Público',title:'Ética, interesse público e conduta',icon:'🤝',tag:'Cidadania',desc:'Transforme princípios éticos em decisões práticas de trabalho.',time:'10 min',body:`<p>Ética no serviço público envolve agir com integridade, respeito, imparcialidade e compromisso com a finalidade pública. Legalidade é indispensável, mas uma decisão responsável também considera transparência, impacto e tratamento igualitário.</p><div class="callout"><b>Perguntas úteis:</b> a decisão tem base normativa? trata pessoas em situações equivalentes com imparcialidade? posso explicar publicamente minhas razões? há conflito de interesses?</div><p>Cada órgão pode ter código de ética e regras próprias. Em prova, observe a norma expressamente indicada; não suponha que a regra de um órgão vale automaticamente para todos.</p>`},
{id:'redacao-oficial',area:'Redação Oficial',title:'Comunicação oficial: clareza e formalidade',icon:'✉️',tag:'Comunicação',desc:'Escreva para comunicar com clareza, concisão e impessoalidade.',time:'11 min',body:`<p>Redação oficial é a comunicação usada em atividades da Administração Pública. Em geral, busca clareza, precisão, objetividade, concisão, coesão, impessoalidade, formalidade e padronização.</p><div class="callout"><b>Antes de enviar:</b> diga o objetivo logo no início, organize as informações em ordem lógica, prefira frases diretas e revise nomes, datas, anexos e destinatário.</div><p>O Manual de Redação da Presidência da República é uma referência federal; órgãos e entes podem adotar normas complementares. Consulte o manual e o edital para modelos e formas de tratamento.</p><a href="https://www.gov.br/planalto/pt-br/acompanhe-o-planalto/assuntos/manual-de-redacao-da-presidencia-da-republica" target="_blank" rel="noreferrer">Consultar Manual de Redação ↗</a>`},
{id:'ingles-leitura',area:'Língua Inglesa',title:'Inglês: leitura estratégica',icon:'🌐',tag:'Idiomas',desc:'Use cognatos, contexto e palavras-chave para entender textos.',time:'10 min',body:`<p>Questões de inglês em concursos frequentemente cobram compreensão global e localização de informação. Comece pelo título, fonte, assunto e pergunta. Depois procure palavras-chave no texto.</p><ul><li><b>Cognatos:</b> palavras parecidas com o português podem ajudar, mas confira o contexto.</li><li><b>Falsos cognatos:</b> parecem familiares, mas têm outro sentido, como “actually” (na verdade).</li><li><b>Conectores:</b> but indica contraste; because indica causa; therefore indica consequência.</li></ul><div class="callout">Não é preciso traduzir cada palavra. Identifique quem faz o quê, qual é a ideia central e quais detalhes respondem ao comando.</div>`},
{id:'ingles-gramatica',area:'Língua Inglesa',title:'Inglês: pronomes e tempos básicos',icon:'🔤',tag:'Idiomas',desc:'Reconheça referentes e pistas de tempo em frases curtas.',time:'11 min',body:`<p>Pronomes ajudam a evitar repetição. Em um texto, they pode retomar pessoas ou coisas no plural; it costuma retomar uma coisa ou ideia singular. Volte ao trecho para confirmar o referente.</p><div class="callout"><b>Pistas de tempo:</b> yesterday costuma apontar para passado; now para presente; tomorrow para futuro. Verbos auxiliares também ajudam a identificar a estrutura.</div><p>Ao responder, releia a frase antes e depois do pronome. A proximidade ajuda, mas o sentido é quem confirma a retomada.</p>`},
{id:'pontuacao',area:'Língua Portuguesa',title:'Pontuação e sentido',icon:'❝',tag:'Gramática',desc:'Veja como a pontuação organiza as ideias e pode mudar a leitura.',time:'10 min',source:'',body:`<p>A pontuação sinaliza relações sintáticas e ajuda o leitor a organizar o texto. A vírgula separa elementos conforme a estrutura; não deve ser usada apenas porque se fez uma pausa na fala.</p><div class="callout"><b>Regra útil:</b> em ordem direta, evite separar sujeito e verbo por vírgula. Em “Os candidatos chegaram cedo”, não se coloca vírgula entre “candidatos” e “chegaram”.</div><p>Vírgulas podem isolar explicações e deslocamentos. Em provas de reescrita, compare a pontuação e pergunte se ela preserva o sentido e as relações entre as partes.</p>`},
{id:'concordancia',area:'Língua Portuguesa',title:'Concordância: quem combina com quem',icon:'🧩',tag:'Gramática',desc:'Localize o núcleo da frase antes de ajustar verbos e nomes.',time:'11 min',source:'',body:`<p>Concordância verbal ajusta o verbo ao sujeito; concordância nominal ajusta artigos, adjetivos e pronomes ao nome. A primeira etapa é localizar o núcleo do sujeito, que pode estar distante do verbo.</p><div class="callout"><b>Exemplo:</b> “A lista de documentos chegou.” O núcleo do sujeito é “lista”, no singular; “documentos” aparece dentro de um complemento.</div><p>Em questões, não escolha a palavra mais próxima do verbo sem conferir a estrutura. Reescreva a frase identificando sujeito e núcleo.</p>`},
{id:'processo-adm',area:'Legislação e Transparência',title:'Processo administrativo federal',icon:'🗂️',tag:'Legislação',desc:'Conheça a finalidade e os princípios básicos da Lei 9.784/1999.',time:'12 min',source:'https://www.planalto.gov.br/ccivil_03/leis/l9784.htm',body:`<p>A Lei 9.784/1999 estabelece normas básicas para o processo administrativo no âmbito da Administração Federal direta e indireta, protegendo direitos dos administrados e contribuindo para o cumprimento das finalidades administrativas.</p><div class="callout"><b>Fique atento ao alcance:</b> é uma lei federal. Estados e municípios podem ter leis próprias; siga o texto indicado no edital.</div><p>Entre os princípios expressamente citados estão legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.</p><a href="https://www.planalto.gov.br/ccivil_03/leis/l9784.htm" target="_blank" rel="noreferrer">Consultar Lei 9.784/1999 no Planalto ↗</a>`},
{id:'servidores',area:'Legislação e Transparência',title:'Regime jurídico dos servidores federais',icon:'🧑‍💼',tag:'Legislação',desc:'Introdução à Lei 8.112/1990 e ao seu campo de aplicação.',time:'12 min',source:'https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm',body:`<p>A Lei 8.112/1990 disciplina o regime jurídico dos servidores públicos civis da União, de suas autarquias e fundações públicas federais. Ela não se aplica automaticamente a todo servidor estadual ou municipal.</p><div class="callout"><b>Como estudar:</b> confira se o edital cobra a lei e quais títulos ou artigos. Comece distinguindo provimento, vacância, direitos, deveres, responsabilidades e processo disciplinar.</div><p>Como a legislação pode sofrer alterações, consulte o texto compilado oficial antes da prova. Este resumo não substitui a leitura dos dispositivos cobrados.</p><a href="https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm" target="_blank" rel="noreferrer">Consultar Lei 8.112/1990 ↗</a>`},
{id:'lai',area:'Legislação e Transparência',title:'Acesso à informação e transparência',icon:'🔎',tag:'Legislação',desc:'Entenda a ideia central da Lei de Acesso à Informação.',time:'10 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2011/lei/l12527.htm',body:`<p>A Lei 12.527/2011, conhecida como LAI, disciplina o acesso a informações públicas. Como noção inicial, a publicidade é a regra e o sigilo é exceção prevista em lei.</p><div class="callout"><b>Transparência ativa:</b> divulgação de informações de interesse público sem depender de pedido. <b>Transparência passiva:</b> resposta a solicitações feitas por pessoas interessadas, observados procedimentos e limites legais.</div><p>Há hipóteses legais de restrição, proteção de dados pessoais e classificação de informações. Estude os prazos e detalhes somente na versão vigente e conforme o edital.</p><a href="https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2011/lei/l12527.htm" target="_blank" rel="noreferrer">Consultar Lei 12.527/2011 no Planalto ↗</a>`},
{id:'atualidades-metodo',area:'Atualidades',title:'Atualidades: como estudar sem decorar manchetes',icon:'🗞️',tag:'Estratégia',desc:'Construa contexto e conecte notícias a temas públicos importantes.',time:'10 min',body:`<p>Atualidades mudam rápido e nem todo concurso cobra a mesma seleção de fatos. Use o edital como filtro e estude temas, causas, atores e consequências, em vez de memorizar manchetes isoladas.</p><div class="callout"><b>Roteiro para uma notícia:</b> o que aconteceu? onde e quando? quais fatores explicam o fato? quem é afetado? quais são os possíveis impactos e quais fontes confirmam as informações?</div><p>Prefira fontes primárias e veículos com transparência editorial. Anote data e origem; compare relatos quando houver controvérsia. Atualize esse estudo perto da prova e respeite o recorte temporal indicado no edital.</p>`}
);
topics.push(
{id:'operacoes-basicas',area:'Matemática',title:'Operações básicas, divisibilidade e ordem',icon:'🧮',tag:'Fundamentos',desc:'Organize as contas e respeite a ordem das operações.',time:'12 min',body:`<p>Resolva primeiro parênteses, depois potências e raízes, multiplicações e divisões, por fim somas e subtrações. Divisibilidade ajuda a simplificar cálculos e frações.</p><div class="callout"><b>Exemplo:</b> em 8 + 2 × 3, multiplique primeiro: 8 + 6 = 14.</div>`},
{id:'potencias-raizes',area:'Matemática',title:'Potenciação, raízes e propriedades',icon:'📐',tag:'Fundamentos',desc:'Entenda potências como multiplicações repetidas e raízes como operação inversa.',time:'12 min',body:`<p>Potência reúne fatores iguais: 2³ = 2 × 2 × 2 = 8. A raiz quadrada pergunta qual número, multiplicado por ele mesmo, resulta no radicando.</p><div class="callout"><b>Exemplo:</b> √49 = 7, pois 7² = 49. Confira as propriedades antes de simplificar expressões.</div>`},
{id:'equacoes-basicas',area:'Matemática',title:'Equações do primeiro grau',icon:'🔣',tag:'Fundamentos',desc:'Isole a incógnita usando operações iguais nos dois lados.',time:'13 min',body:`<p>Uma equação é uma igualdade com valor desconhecido. Para encontrar x, faça a mesma operação nos dois lados e confira o resultado substituindo a resposta na equação inicial.</p><div class="callout"><b>Exemplo:</b> x + 5 = 12; subtraindo 5 dos dois lados, x = 7.</div>`},
{id:'estatistica-graficos',area:'Matemática',title:'Estatística básica, tabelas e gráficos',icon:'📊',tag:'Fundamentos',desc:'Leia escalas e compare média, mediana e moda.',time:'12 min',body:`<p>Média é soma dividida pela quantidade; mediana é o valor central após ordenar; moda é o que mais aparece. Em gráficos, leia título, legenda, escala, unidade e período.</p><div class="callout"><b>Exemplo:</b> em 2, 4, 4, 10, a moda é 4 e a média é 5.</div>`},
{id:'tabela-verdade',area:'Raciocínio Lógico',title:'Tabelas-verdade e conectivos',icon:'📋',tag:'Lógica',desc:'Descubra quando proposições compostas são verdadeiras ou falsas.',time:'13 min',body:`<p>Uma tabela-verdade registra todas as combinações possíveis de valores lógicos. Na conjunção “p e q”, ambas precisam ser verdadeiras; na disjunção “p ou q”, basta uma verdadeira.</p><div class="callout"><b>Exemplo:</b> V e F resulta em F; V ou F resulta em V.</div>`},
{id:'condicional-equivalencias',area:'Raciocínio Lógico',title:'Condicional, bicondicional e equivalências',icon:'↔',tag:'Lógica',desc:'Interprete “se... então” e reconheça formas equivalentes.',time:'14 min',body:`<p>“Se p, então q” só é falsa quando p ocorre e q não ocorre. A contrapositiva “se não q, então não p” é equivalente; a recíproca, em geral, não é.</p><div class="callout"><b>Exemplo:</b> se chove, a rua molha. Rua molhada, sozinha, não prova que choveu.</div>`},
{id:'argumentos-logicos',area:'Raciocínio Lógico',title:'Argumentos, premissas e conclusão',icon:'🧠',tag:'Lógica',desc:'Separe dados, regra e conclusão antes de julgar um raciocínio.',time:'12 min',body:`<p>Premissas são informações assumidas no argumento; conclusão é o resultado que se quer sustentar. Validade depende da forma lógica, enquanto a verdade depende também do conteúdo das premissas.</p><div class="callout"><b>Exemplo:</b> todos os A são B; x é A; logo, x é B. A conclusão segue da forma.</div>`},
{id:'conjuntos-contagem',area:'Raciocínio Lógico',title:'Conjuntos, contagem e probabilidade',icon:'⭕',tag:'Lógica',desc:'Use diagramas para contar elementos sem repetir e calcular chances simples.',time:'14 min',body:`<p>Conjuntos agrupam elementos. Diagramas de Venn mostram interseção e união. Em situações equiprováveis, probabilidade é casos favoráveis divididos pelo total de casos possíveis.</p><div class="callout"><b>Exemplo:</b> ao lançar um dado justo, a chance de sair número par é 3/6 = 1/2.</div>`},
{id:'sistemas-operacionais',area:'Informática',title:'Sistemas operacionais, janelas e atalhos',icon:'🖥️',tag:'Tecnologia',desc:'Reconheça funções do sistema e atalhos comuns sem confundir programa e arquivo.',time:'12 min',body:`<p>O sistema operacional administra recursos do computador e oferece uma interface para abrir programas, organizar arquivos, usar dispositivos e ajustar configurações. Atalhos executam comandos mais rapidamente.</p><div class="callout"><b>Dica:</b> atalho aponta para um arquivo ou programa; não é uma cópia do conteúdo.</div>`},
{id:'editores-documentos',area:'Informática',title:'Editores de texto e formatos de documentos',icon:'📝',tag:'Tecnologia',desc:'Entenda formatação, salvar, exportar e diferenças entre formatos.',time:'11 min',body:`<p>Editor de texto permite criar e formatar documentos. Salvar mantém um arquivo editável; exportar para PDF preserva a apresentação para leitura e compartilhamento.</p><div class="callout"><b>Prova:</b> extensão indica formato provável, mas renomear .docx para .pdf não converte o arquivo.</div>`},
{id:'seguranca-digital',area:'Informática',title:'Segurança digital, golpes e privacidade',icon:'🛡️',tag:'Tecnologia',desc:'Identifique phishing e proteja contas com práticas simples.',time:'12 min',body:`<p>Phishing tenta induzir a vítima a revelar senhas ou dados por mensagens e páginas falsas. Use senhas diferentes, autenticação em dois fatores, atualizações e confira remetente e domínio.</p><div class="callout"><b>Regra prática:</b> urgência e ameaça em um link inesperado são sinais para parar e verificar a origem.</div>`},
{id:'backup-nuvem',area:'Informática',title:'Backup, armazenamento em nuvem e sincronização',icon:'☁️',tag:'Tecnologia',desc:'Diferencie cópia de segurança de sincronização automática.',time:'10 min',body:`<p>Backup cria cópia recuperável de dados. Sincronização replica alterações entre dispositivos; se um arquivo for apagado, a remoção pode se propagar. Mantenha cópias separadas e teste a restauração.</p><div class="callout"><b>Exemplo:</b> arquivo na nuvem sincronizado não substitui uma cópia independente.</div>`},
{id:'const-competencias',area:'Direito Constitucional',title:'Organização do Estado e competências',icon:'🗺️',tag:'Direito',desc:'Estude União, estados, municípios e Distrito Federal pela repartição constitucional.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>A Constituição organiza os entes federativos e distribui competências. Competências comuns, concorrentes e privativas têm regras próprias; leia os artigos indicados no edital e observe a possibilidade de suplementação.</p><div class="callout"><b>Na prova:</b> identifique primeiro qual ente atua e qual tipo de competência está sendo cobrado.</div>`},
{id:'const-sociais',area:'Direito Constitucional',title:'Direitos sociais e ordem social',icon:'🏥',tag:'Direito',desc:'Localize direitos sociais e políticas protegidas na Constituição.',time:'13 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>Direitos sociais buscam garantir condições básicas de vida e participação. A Constituição prevê, entre outros, educação, saúde, trabalho, moradia, transporte, previdência e assistência, com regras específicas.</p><div class="callout"><b>Estudo:</b> confira o texto constitucional vigente e diferencie direito previsto de política pública que o concretiza.</div>`},
{id:'const-remedios',area:'Direito Constitucional',title:'Remédios constitucionais: para que serve cada um',icon:'🛡️',tag:'Direito',desc:'Compare habeas corpus, mandado de segurança, habeas data e ação popular.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>Remédios constitucionais protegem direitos em situações diferentes. Associe cada instrumento ao direito protegido, quem pode impetrar, autoridade envolvida e requisitos do artigo constitucional.</p><div class="callout"><b>Exemplo:</b> habeas corpus protege liberdade de locomoção contra ilegalidade ou abuso de poder.</div>`},
{id:'const-nacionalidade',area:'Direito Constitucional',title:'Nacionalidade e direitos políticos',icon:'🗳️',tag:'Direito',desc:'Organize regras de nacionalidade, alistamento, voto e elegibilidade.',time:'13 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>A Constituição define brasileiros natos e naturalizados, além de direitos políticos, condições de elegibilidade e hipóteses de perda ou suspensão. Memorize pelo texto vigente e pelas exceções expressas.</p><div class="callout"><b>Na prova:</b> não generalize exceções; compare a hipótese com o artigo e o inciso específicos.</div>`},
{id:'adm-servicos',area:'Direito Administrativo',title:'Serviços públicos e responsabilidade do Estado',icon:'🚍',tag:'Direito',desc:'Entenda prestação de serviços, delegação e dever de reparar danos.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>Serviço público atende necessidades coletivas sob regras públicas, podendo ser prestado diretamente ou delegado conforme a lei. Responsabilidade estatal exige analisar atuação, dano e nexo causal, além das excludentes aplicáveis.</p><div class="callout"><b>Exemplo:</b> concessão transfere a execução do serviço segundo contrato e fiscalização do poder público.</div>`},
{id:'adm-agentes',area:'Direito Administrativo',title:'Agentes públicos: deveres e responsabilidades',icon:'👥',tag:'Direito',desc:'Separe cargo, emprego e função e reconheça responsabilidades do agente.',time:'13 min',source:'https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm',body:`<p>Agente público é quem exerce função estatal, por vínculo e duração diversos. Questões podem cobrar deveres, proibições, responsabilidade civil, penal e administrativa e a necessidade de processo adequado.</p><div class="callout"><b>Importante:</b> as esferas podem ser independentes, respeitadas as hipóteses legais de repercussão.</div>`},
{id:'adm-controle',area:'Direito Administrativo',title:'Controle da Administração Pública',icon:'🔍',tag:'Direito',desc:'Compare controles interno, externo, judicial e social.',time:'12 min',source:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm',body:`<p>Controle verifica legalidade, legitimidade, economicidade e resultados administrativos. Pode ocorrer dentro do próprio órgão, por outro Poder, por tribunais de contas ou pela sociedade, nos limites constitucionais.</p><div class="callout"><b>Na prova:</b> identifique quem controla, o objeto examinado e se o controle é prévio ou posterior.</div>`},
{id:'adm-processo-disciplinar',area:'Direito Administrativo',title:'Processo disciplinar e ampla defesa',icon:'⚖️',tag:'Direito',desc:'Conheça finalidade, etapas e garantias do processo administrativo disciplinar.',time:'14 min',source:'https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm',body:`<p>O processo disciplinar apura possível infração funcional com contraditório e ampla defesa. Estude instauração, comissão, instrução, defesa, relatório e julgamento conforme o regime jurídico aplicável.</p><div class="callout"><b>Para revisar:</b> diferencie sindicância de processo disciplinar e confira efeitos e prazos no texto legal vigente.</div>`},
{id:'etica-deveres',area:'Ética no Serviço Público',title:'Deveres, vedações e zelo pelo patrimônio',icon:'🧭',tag:'Cidadania',desc:'Transforme o código de ética em decisões de atendimento e rotina.',time:'11 min',source:'https://www.planalto.gov.br/ccivil_03/decreto/d1171.htm',body:`<p>O código de ética orienta deveres de honestidade, respeito, zelo, cortesia e compromisso com o interesse público. Também apresenta vedações; estude o texto cobrado no edital e o código específico do órgão.</p><div class="callout"><b>Exemplo:</b> usar recurso público para finalidade particular contraria o dever de zelo.</div>`},
{id:'etica-conflito',area:'Ética no Serviço Público',title:'Conflito de interesses e imparcialidade',icon:'⚖️',tag:'Cidadania',desc:'Reconheça quando interesse privado pode afetar decisão pública.',time:'11 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12813.htm',body:`<p>Conflito de interesses surge quando interesses privados podem influenciar o exercício imparcial da função. Identifique vínculos, uso de informação privilegiada, favorecimento e dever de comunicar a situação.</p><div class="callout"><b>Na prova:</b> conflito pode existir mesmo sem dano financeiro já comprovado.</div>`},
{id:'etica-atendimento',area:'Ética no Serviço Público',title:'Ética no atendimento ao cidadão',icon:'🤝',tag:'Cidadania',desc:'Aplique respeito, urbanidade, igualdade e responsabilidade no atendimento.',time:'9 min',body:`<p>Atender com ética envolve tratar as pessoas com respeito, informar com clareza, proteger dados e encaminhar solicitações corretamente. Cortesia não elimina o dever de seguir regras e critérios iguais.</p><div class="callout"><b>Exemplo:</b> não furar fila por amizade preserva impessoalidade e igualdade.</div>`},
{id:'etica-integridade',area:'Ética no Serviço Público',title:'Integridade, transparência e prestação de contas',icon:'✅',tag:'Cidadania',desc:'Relacione conduta íntegra, registro de decisões e controle social.',time:'10 min',body:`<p>Integridade combina prevenção, regras claras, exemplo da liderança e canais seguros de orientação e denúncia. Transparência e prestação de contas permitem acompanhar decisões e uso de recursos públicos.</p><div class="callout"><b>Revisão:</b> transparência deve respeitar sigilos legais e proteção de dados pessoais.</div>`},
{id:'redacao-padrao-oficio',area:'Redação Oficial',title:'Padrão ofício: estrutura e organização',icon:'📄',tag:'Comunicação',desc:'Reconheça partes, ordem e finalidade de um expediente oficial.',time:'12 min',source:'https://www.gov.br/cidades/pt-br/midia/documentos/pdf/manualderedacao.pdf',body:`<p>O padrão ofício organiza comunicações oficiais com identificação, endereçamento, assunto, texto, fecho e assinatura. Use a edição indicada pelo edital e respeite os modelos do órgão.</p><div class="callout"><b>Na prova:</b> relacione cada elemento à sua função; não invente fórmulas de tratamento.</div>`},
{id:'redacao-email',area:'Redação Oficial',title:'E-mail e comunicação digital oficial',icon:'📧',tag:'Comunicação',desc:'Escreva assunto claro, mensagem concisa e anexo corretamente identificado.',time:'10 min',source:'https://www.gov.br/cidades/pt-br/midia/documentos/pdf/manualderedacao.pdf',body:`<p>E-mail oficial deve identificar o assunto, apresentar a informação necessária e manter formalidade adequada. Confira destinatários, anexos, sigilo e clareza antes do envio.</p><div class="callout"><b>Exemplo:</b> “Assunto: Envio do relatório mensal — unidade X” informa melhor que “Oi”.</div>`},
{id:'redacao-clareza',area:'Redação Oficial',title:'Clareza, concisão e impessoalidade',icon:'✂️',tag:'Comunicação',desc:'Revise frases longas, ambiguidades e marcas pessoais desnecessárias.',time:'11 min',source:'https://www.gov.br/cidades/pt-br/midia/documentos/pdf/manualderedacao.pdf',body:`<p>Clareza facilita a leitura; concisão elimina excesso sem retirar dados necessários; impessoalidade concentra o texto na informação e na instituição. Prefira ordem direta e termos precisos.</p><div class="callout"><b>Reescrita:</b> troque “venho por meio deste informar” por “Informo” quando o contexto permitir.</div>`},
{id:'redacao-datas-numeros',area:'Redação Oficial',title:'Datas, siglas, números e formatação',icon:'🔠',tag:'Comunicação',desc:'Padronize elementos gráficos e evite variações dentro do mesmo documento.',time:'10 min',source:'https://www.gov.br/cidades/pt-br/midia/documentos/pdf/manualderedacao.pdf',body:`<p>Padronize datas, siglas, números, títulos e destaques conforme o manual e as regras do órgão. Na primeira ocorrência, apresente o nome por extenso quando necessário para compreensão.</p><div class="callout"><b>Revisão:</b> verifique consistência entre assunto, corpo, anexos e identificação do documento.</div>`},
{id:'ingles-cognatos',area:'Língua Inglesa',title:'Cognatos, falsos cognatos e vocabulário',icon:'🔤',tag:'Idiomas',desc:'Use palavras parecidas como pista sem confiar apenas na aparência.',time:'10 min',body:`<p>Cognatos têm forma e significado semelhantes entre português e inglês. Falsos cognatos parecem familiares, mas significam outra coisa. Confirme pelo contexto e pela função na frase.</p><div class="callout"><b>Exemplo:</b> “actual” costuma significar “real/verdadeiro”, não “atual”.</div>`},
{id:'ingles-pronomes',area:'Língua Inglesa',title:'Pronomes, referentes e coesão em inglês',icon:'🧵',tag:'Idiomas',desc:'Localize quem ou o que cada pronome retoma no texto.',time:'11 min',body:`<p>Pronomes como it, they, he e she retomam nomes ou ideias já mencionadas. Para achar o referente, confira número, pessoa e sentido nas frases próximas.</p><div class="callout"><b>Exemplo:</b> “The reports arrived. They are complete.” “They” retoma “reports”.</div>`},
{id:'ingles-tempos',area:'Língua Inglesa',title:'Tempos verbais, auxiliares e preposições',icon:'⏱️',tag:'Idiomas',desc:'Use marcadores de tempo e verbos auxiliares para compreender frases.',time:'12 min',body:`<p>Reconheça a forma do verbo e palavras como did, will, can e have. Marcadores como yesterday, usually e tomorrow ajudam a situar o evento; preposições dependem da expressão e do contexto.</p><div class="callout"><b>Exemplo:</b> “She did not work yesterday” indica uma ação negada no passado.</div>`},
{id:'ingles-artigos',area:'Língua Inglesa',title:'Artigos, substantivos e plural',icon:'📘',tag:'Idiomas',desc:'Identifique nomes, artigos e regras frequentes de singular e plural.',time:'10 min',body:`<p>Substantivos nomeiam pessoas, lugares, objetos e ideias. Em inglês, a (som consonantal) e an (som vocálico) introduzem um nome contável singular; the aponta para algo definido. Muitos plurais recebem -s ou -es, mas existem formas irregulares.</p><div class="callout"><b>Exemplo:</b> “a book” = um livro; “an apple” = uma maçã; “the books” = os livros já identificados.</div><p>Observe se o nome é contável e se já foi apresentado no texto. Isso ajuda a interpretar a referência de a/an e the.</p>`},
{id:'ingles-adjetivos',area:'Língua Inglesa',title:'Adjetivos, advérbios e ordem das palavras',icon:'🧭',tag:'Idiomas',desc:'Reconheça o que caracteriza um nome e o que modifica uma ação.',time:'11 min',body:`<p>Adjetivos caracterizam substantivos e normalmente aparecem antes deles: “a difficult question”. Advérbios modificam verbos, adjetivos ou outros advérbios: “read carefully” significa ler com atenção.</p><div class="callout"><b>Par:</b> quick é adjetivo (“a quick answer”); quickly é advérbio (“answer quickly”).</div><p>Na leitura, veja qual palavra está sendo modificada para não confundir qualidade de uma coisa com modo de uma ação.</p>`},
{id:'ingles-auxiliares',area:'Língua Inglesa',title:'Verbo to be, auxiliares, negação e perguntas',icon:'❓',tag:'Idiomas',desc:'Use auxiliares para reconhecer frases afirmativas, negativas e interrogativas.',time:'12 min',body:`<p>To be (am, is, are; was, were) pode ligar sujeito a uma característica ou indicar estado. Do/does ajudam a formar perguntas e negativas no presente simples; did faz isso no passado. O auxiliar carrega a marca de tempo e o verbo principal volta à forma base em perguntas e negativas.</p><div class="callout"><b>Exemplo:</b> “She works” → “Does she work?”; “They went” → “Did they go?”.</div><p>Não use simultaneamente did e o passado no verbo principal: “Did he go?” é a forma padrão.</p>`},
{id:'ingles-modais',area:'Língua Inglesa',title:'Verbos modais: can, may, must e should',icon:'⚙️',tag:'Idiomas',desc:'Interprete capacidade, possibilidade, obrigação e recomendação.',time:'11 min',body:`<p>Modais são auxiliares que expressam atitude ou grau de certeza. Can pode indicar capacidade ou possibilidade; may, permissão ou possibilidade; must, obrigação ou forte conclusão; should, recomendação ou expectativa.</p><div class="callout"><b>Exemplo:</b> “You should check the source” = Você deveria conferir a fonte.</div><p>Depois de um modal, o verbo principal geralmente fica na forma base, sem to: “must read”, “can work”.</p>`},
{id:'ingles-passiva',area:'Língua Inglesa',title:'Voz passiva e foco da informação',icon:'🔄',tag:'Idiomas',desc:'Perceba quando o texto destaca quem recebe a ação.',time:'12 min',body:`<p>Na voz ativa, o sujeito pratica a ação: “The team published the report”. Na passiva, o foco vai para quem ou o que recebe a ação: “The report was published”. A estrutura comum é be + particípio passado; o tempo aparece no verbo be.</p><div class="callout"><b>Exemplo:</b> “The data are collected every year” destaca os dados coletados; o agente pode nem ser mencionado.</div><p>Textos formais e científicos usam passivas com frequência. Procure o verbo be e a forma do particípio.</p>`},
{id:'ingles-conectores',area:'Língua Inglesa',title:'Conectores e relações entre ideias',icon:'🔗',tag:'Idiomas',desc:'Use conectivos para localizar contraste, causa, adição e conclusão.',time:'10 min',body:`<p>Conectores mostram como as frases se relacionam. But/however indicam contraste; because/since indicam causa; so/therefore indicam resultado; also/moreover acrescentam informação; although introduz concessão.</p><div class="callout"><b>Exemplo:</b> “The service is free, but registration is required.” O serviço é gratuito, porém é necessário se registrar.</div><p>Ao responder, não traduza o conector isoladamente: veja a relação que ele estabelece entre as duas ideias.</p>`},
{id:'ingles-comparativos',area:'Língua Inglesa',title:'Comparativos e superlativos',icon:'📊',tag:'Idiomas',desc:'Compare pessoas e coisas e identifique o grau máximo.',time:'10 min',body:`<p>Comparativos relacionam dois elementos: adjetivos curtos frequentemente recebem -er + than (smaller than); formas longas usam more + adjetivo + than (more useful than). Superlativos indicam o grau máximo em um grupo: the smallest, the most useful.</p><div class="callout"><b>Irregulares comuns:</b> good → better → the best; bad → worse → the worst.</div><p>Than costuma introduzir o segundo elemento da comparação; the frequentemente aparece antes do superlativo.</p>`},
{id:'ingles-condicionais',area:'Língua Inglesa',title:'Condicionais com if',icon:'🔀',tag:'Idiomas',desc:'Entenda condição real, hipótese e consequência em frases com if.',time:'12 min',body:`<p>If introduz uma condição. Em uma situação possível no futuro, é comum usar presente depois de if e will na consequência: “If it rains, we will stay home”. Para hipóteses improváveis, aparece frequentemente passado simples e would na consequência.</p><div class="callout"><b>Exemplo:</b> “If I had more time, I would study English” = Se eu tivesse mais tempo, estudaria inglês.</div><p>Identifique condição e resultado antes de traduzir a frase toda.</p>`},
{id:'ingles-preposicoes',area:'Língua Inglesa',title:'Preposições de tempo e lugar',icon:'📍',tag:'Idiomas',desc:'Diferencie usos comuns de in, on e at pelo contexto.',time:'10 min',body:`<p>In, on e at variam conforme o tipo de referência. Como tendência: in para períodos amplos e espaços delimitados (in July, in Brazil); on para dias, datas e superfícies (on Monday, on the table); at para horários e pontos específicos (at 8 o’clock, at the door).</p><div class="callout"><b>Exemplo:</b> “The meeting is at 9 a.m. on Friday in room 2.” horário, dia e local específico.</div><p>Há expressões fixas e exceções; use a frase completa para descobrir a relação indicada.</p>`},
{id:'ingles-formacao-palavras',area:'Língua Inglesa',title:'Prefixos, sufixos e formação de palavras',icon:'🧱',tag:'Idiomas',desc:'Use partes das palavras e a posição na frase para inferir significado.',time:'11 min',body:`<p>Prefixos e sufixos podem alterar sentido ou classe gramatical. Un- frequentemente indica negação; re- pode indicar repetição; -less sugere ausência; -ful sugere presença de uma qualidade; -tion e -ment formam muitos substantivos.</p><div class="callout"><b>Exemplo:</b> “care” (cuidado), “careful” (cuidadoso), “careless” (descuidado).</div><p>Use o radical, o afixo e a função da palavra na frase como pistas; a forma sozinha não garante a tradução.</p>`},
{id:'lai-decreto',area:'Legislação e Transparência',title:'Regulamento da LAI e prazos de resposta',icon:'⏳',tag:'Legislação',desc:'Compare a lei, o regulamento federal e os fluxos de pedido e recurso.',time:'12 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/decreto/d7724.htm',body:`<p>O Decreto 7.724/2012 regulamenta a LAI no Poder Executivo federal. Estude procedimento, transparência ativa, pedido, resposta, recursos e hipóteses de sigilo previstas no texto vigente.</p><div class="callout"><b>Na prova:</b> confira se o enunciado pergunta pela lei geral ou pelo regulamento federal.</div>`},
{id:'lgpd-publico',area:'Legislação e Transparência',title:'LGPD no setor público e proteção de dados',icon:'🔐',tag:'Legislação',desc:'Equilibre transparência, finalidade pública e proteção de dados pessoais.',time:'13 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm',body:`<p>A LGPD regula o tratamento de dados pessoais por entes públicos e privados. No setor público, observe finalidade, necessidade, segurança, transparência e as bases legais aplicáveis.</p><div class="callout"><b>Não confunda:</b> dado pessoal não é automaticamente sigiloso em qualquer situação; avalie a lei e o contexto.</div>`},
{id:'dados-abertos',area:'Legislação e Transparência',title:'Dados abertos e transparência ativa',icon:'📊',tag:'Legislação',desc:'Entenda divulgação proativa, formatos reutilizáveis e limites legais.',time:'11 min',source:'https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/decreto/d8777.htm',body:`<p>Dados abertos são disponibilizados de modo que possam ser acessados, processados e reutilizados, respeitados sigilos e dados pessoais. Transparência ativa reduz a necessidade de solicitações individuais.</p><div class="callout"><b>Exemplo:</b> planilhas públicas em formato aberto permitem comparação e análise automatizada.</div>`},
{id:'atualidades-economia',area:'Atualidades',title:'Economia cotidiana, inflação e orçamento público',icon:'💰',tag:'Estratégia',desc:'Conecte indicadores, orçamento e efeitos na vida das pessoas.',time:'12 min',body:`<p>Estude inflação, juros, emprego, renda e orçamento relacionando indicador, período, causa possível e impacto social. Diferencie dado observado, previsão e opinião.</p><div class="callout"><b>Roteiro:</b> anote fonte, data, indicador, tendência e quem é afetado.</div>`},
{id:'atualidades-clima',area:'Atualidades',title:'Clima, ambiente e políticas públicas',icon:'🌱',tag:'Estratégia',desc:'Relacione eventos ambientais, prevenção, adaptação e ação pública.',time:'12 min',body:`<p>Em temas ambientais, separe evento meteorológico de mudança climática e conecte evidências, vulnerabilidade, prevenção e políticas de adaptação. Use dados e fontes científicas identificadas.</p><div class="callout"><b>Na prova:</b> uma notícia isolada não substitui séries de dados e contexto.</div>`},
{id:'atualidades-sociedade',area:'Atualidades',title:'População, saúde e desigualdades',icon:'👥',tag:'Estratégia',desc:'Leia indicadores sociais com atenção a período, grupo e território.',time:'11 min',body:`<p>Indicadores de população, saúde e desigualdade variam por idade, região e grupo social. Ao estudar uma notícia, pergunte como o dado foi medido, quem está incluído e qual período representa.</p><div class="callout"><b>Exemplo:</b> média nacional pode esconder diferenças entre municípios e grupos.</div>`},
{id:'atualidades-tecnologia',area:'Atualidades',title:'Tecnologia, inteligência artificial e desinformação',icon:'🤖',tag:'Estratégia',desc:'Avalie impactos, riscos, fontes e responsabilidades no uso da tecnologia.',time:'12 min',body:`<p>Estude tecnologias emergentes por aplicações, oportunidades, riscos, regulação e efeitos sociais. Em conteúdos digitais, verifique autoria, data, fonte original e evidências antes de compartilhar.</p><div class="callout"><b>Dica:</b> uma imagem ou trecho fora de contexto não confirma a veracidade de uma notícia.</div>`}
);
